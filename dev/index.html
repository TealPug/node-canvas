<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tealpug-node-canvas — dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #16162a;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }

    .toolbar h1 {
      font-size: 14px;
      font-weight: 600;
      margin-right: auto;
      color: #7eb8da;
    }

    .toolbar button {
      padding: 6px 14px;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      background: #1e1e3a;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .toolbar button:hover {
      background: #2a2a50;
      color: #fff;
    }

    .toolbar .filename {
      font-size: 12px;
      color: #888;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar .node-count {
      font-size: 11px;
      color: #666;
      padding: 4px 8px;
      background: #111;
      border-radius: 3px;
    }

    #editor {
      flex: 1;
      min-height: 0;
    }

    .tnc-node--selected {
      outline: 2px solid #4a9eff !important;
      outline-offset: -1px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      background: #2a2a50;
      border: 1px solid #4a9eff;
      border-radius: 6px;
      font-size: 12px;
      color: #ccc;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>tealpug-node-canvas</h1>
    <span class="filename" id="filename">No file loaded</span>
    <span class="node-count" id="nodeCount"></span>
    <button id="btnOpen">Open workflow</button>
    <button id="btnSave" disabled>Save</button>
    <button id="btnSaveAs" disabled>Save as…</button>
    <button id="btnFit" disabled>Fit to view</button>
    <button id="btnLayout" disabled>Auto layout</button>
  </div>
  <div id="editor"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
